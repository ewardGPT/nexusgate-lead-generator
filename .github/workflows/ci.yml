name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install
        working-directory: apps/worker

      - name: Typecheck
        run: npm run typecheck
        working-directory: apps/worker

      - name: Build
        run: npm run build
        working-directory: apps/worker
